include:
  - project: 'ensembl-web/ensembl-gitlab-ci-templates'
    ref: 'main'
    file: 'security-scan/.ensembl-security-jobs.yaml'
    inputs:
      docker_build_job: 'BE-Docker'

stages:
  - security-scan
  - setup
  - build-eardo
  - build
  - container-scan
  - deploy

variables:
  DOCKER_IMAGE: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
  DOCKER_TLS_CERTDIR: ""
  BASE: ensembl-k8s-manifests/genome-browser
  NFS_SERVER: ${HL_NFS_SERVER_CODON}
  NFS_PATH: ${HL_NFS_PATH_CODON}
  FORCE_REVIEW_SETUP:
    value: "false"
    options:
      - "true"
      - "false"
    description: "Force the setup of the review environment. This is only applicable to feature branches."

.build-eardo:
  stage: build-eardo
  image: dockerhub.ebi.ac.uk/ensembl-web/peregrine-eard:latest

  script:
    - cd backend-server
    - ./build-begs.sh

  artifacts:
    name: eardo_artifacts
    paths:
      - backend-server/egs-data/begs/render16.eardo

.be-build-rules:
  rules:
    - if: '$CI_DEPLOY_FREEZE == null'
      changes:
        - backend-server/**/*
      when: on_success
    - when: never

.be-deploy-rules-live:
  rules:
    - if: '$CI_DEPLOY_FREEZE == null && $CI_COMMIT_BRANCH == "master"'
      changes:
        - backend-server/**/*
      when: manual
    - when: never

.be-deploy-rules-test:
  rules:
    - if: '$CI_DEPLOY_FREEZE == null && $CI_COMMIT_BRANCH == "master"'
      changes:
        - backend-server/**/*
      when: on_success
    - when: never

.be-deploy-rules-review:
  rules:
    - if: '$CI_DEPLOY_FREEZE == null && $CI_COMMIT_BRANCH != "master"'
      changes:
        - backend-server/**/*
      when: on_success
    - when: never

.build_backend:
  extends: .be-build-rules
  stage: build
  image: docker
  services:
    - docker:dind

  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - cd backend-server

  script:
    - docker build -t ${DOCKER_IMAGE} --no-cache .
    - docker push ${DOCKER_IMAGE}
    - docker rmi ${DOCKER_IMAGE}
    - docker logout $CI_REGISTRY

.deploy_backend_base:
  stage: deploy
  image: dockerhub.ebi.ac.uk/ensembl-web/deploy-tools:latest
  before_script:
    - kubectl config use-context ${AGENT}
    - kubectl config set-context --current --namespace=${NS} 
  script:
    # Download kustomize manifests and update nfs server/path
    - git clone --depth 1 --branch k8s123-migration https://gitlab.ebi.ac.uk/ensembl-web/ensembl-k8s-manifests.git
    - sed -i "s#<NFS_SERVER>#${NFS_SERVER}#g" ${BASE}/hi/nfs-deployment.patch.yaml
    - sed -i "s#<NFS_PATH>#${NFS_PATH}#g" ${BASE}/hi/nfs-deployment.patch.yaml
    - sed -i "s#<NFS_SERVER>#${NFS_SERVER}#g" ${BASE}/lo/nfs-deployment.patch.yaml
    - sed -i "s#<NFS_PATH>#${NFS_PATH}#g" ${BASE}/lo/nfs-deployment.patch.yaml
    # Update docker image
    - cd ${BASE}/deploy
    - kustomize edit set image DOCKER_IMAGE=${DOCKER_IMAGE}
    # Build hi/lo deployment/configmap manifests and apply
    - kubectl apply -k .

.deploy_backend_live:
  extends:
    - .deploy_backend_base
    - .be-deploy-rules-live

.deploy_backend_test:
  extends:
    - .deploy_backend_base
    - .be-deploy-rules-test

.deploy_backend_review:
  extends:
    - .deploy_backend_base
    - .be-deploy-rules-review

BE-eardo:
  extends: .build-eardo

BE-Docker:
  extends: .build_backend

Prod:
  extends: .deploy_backend_live
  environment:
    name: production
  variables:
    AGENT: ${PROD_AGENT}
    NS: ${PROD_NS}

Fallback:
  extends: .deploy_backend_live
  environment:
    name: fallback
  variables:
    AGENT: ${FALLBACK_AGENT}
    NS: ${FALLBACK_NS}
    NFS_SERVER: ${HX_NFS_SERVER_CODON}
    NFS_PATH: ${HX_NFS_PATH_CODON}

Staging:
  extends: .deploy_backend_test
  environment:
    name: staging
  variables:
    AGENT: ${STAGING_AGENT}
    NS: ${STAGING_NS}

Dev:
  extends: .deploy_backend_test
  environment:
    name: development
  variables:
    AGENT: ${DEV_AGENT}
    NS: ${DEV_NS}

Deploy Review:
  extends: .deploy_backend_review
  resource_group: review/$CI_COMMIT_REF_SLUG
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    on_stop: Stop Review
  variables:
    AGENT: ${REVIEW_AGENT}
    NS: ${CI_COMMIT_REF_SLUG}

Setup Review:
  stage: setup
  image: dockerhub.ebi.ac.uk/ensembl-web/deploy-tools:latest
  environment:
    name: development
  variables:
    AGENT: ${DEV_AGENT}
    NS: ${CI_COMMIT_REF_SLUG}
  rules: # Run only when a new branch is created or when FORCE_REVIEW_SETUP is set to true
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $FORCE_REVIEW_SETUP == "true"
      when: always
    - if: $CI_PIPELINE_SOURCE == "push" && 
          $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"
      when: on_success
    - when: never
  before_script:
    - kubectl config use-context ${AGENT}
    # Check for review namespace, create if it doesn't exist, and remove ingress for default GB backend
    - kubectl create namespace ${NS} --dry-run=client -o yaml | kubectl apply -f -
    # Setup ebi dockerhub credentials in review ns (for non-default backend deployments)
    - |
      kubectl -n ${NS} create secret docker-registry \
        ensemblweb-pull-secret \
        --docker-server=${GITLAB_REGISTRY_URL} \
        --docker-username=${WEB_PULL_DOCKER_USER} \
        --docker-password=${WEB_PULL_DOCKER_SECRET} \
        --docker-email=${WEB_PULL_DOCKER_EMAIL} \
        --dry-run=client -o yaml | 
        kubectl -n "${NS}" apply -f -
    - kubectl -n ensembl-dev delete ingress genome-browser-server-ingress-hi-${NS} || true
    - kubectl -n ensembl-dev delete ingress genome-browser-server-ingress-lo-${NS} || true
    - kubectl config set-context --current --namespace=${NS}
  script:
    # Download kustomize manifests and update nfs server/path
    - git clone --depth 1 --branch k8s123-migration https://gitlab.ebi.ac.uk/ensembl-web/ensembl-k8s-manifests.git
    # Prepare/apply secrets, configmap, hi/lo service and ingress manifests
    - cd ensembl-k8s-manifests
    - kubectl apply -f genome-browser/review/sources-toml-configmap.yaml
    - sed -i "s#<MC_PREFIX>#${NS}#g" genome-browser/review/secrets.yaml
    - kubectl apply -f genome-browser/review/secrets.yaml
    - cp genome-browser/review/hi/svc/*.yaml ./ # kustomize restrictions workaround
    - kubectl apply -k .
    - cp genome-browser/review/lo/svc/*.yaml ./
    - kubectl apply -k .
    - cp review-setup/ingress-host.patch.yaml ./
    - sed -i "s#<HOST>#${NS}.review.ensembl.org#g" ingress-host.patch.yaml
    - cp genome-browser/review/hi/*.yaml ./
    - kubectl apply -k .
    - cp genome-browser/review/lo/*.yaml ./
    - kubectl apply -k .

Stop Review:
  stage: deploy
  image: dockerhub.ebi.ac.uk/ensembl-web/deploy-tools:latest
  resource_group: review/$CI_COMMIT_REF_SLUG
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "dev"
      when: manual
      allow_failure: true
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  variables:
    GIT_STRATEGY: none
    NS: ${CI_COMMIT_REF_SLUG}
    AGENT: ${DEV_AGENT}
  script:
    - |
      if [ "${REVIEW_NS}" = "ensembl-dev" ]; then
        echo "Refusing to delete protected namespace ensembl-dev" >&2
        exit 1
      fi
    - kubectl config use-context ${AGENT}
    - kubectl delete namespace ${REVIEW_NS} || echo "Please delete ${REVIEW_NS} branch in Ensembl-client to cleanup the review namespace"
