include_files = [
    "tracks-include.toml"
]

from_bundles = [
    "boot",
    "test"
]

[include.focus-gene.general]
triggers = [
    ["track","focus","item","gene"]
]

[include.focus-gene.settings]
focus-gene = ["track","focus","item","gene"]
focus = ["track","focus"]
focus-gene-label = ["track","focus","label"]
focus-transcript-label = ["track","focus","transcript-label"]
several = ["track","focus","several"]
enabled-transcripts = ["track","focus","enabled-transcripts"]
name = ["track","focus","name"]
expanded = ["buttons"]

#
# Tracks
#

[track.focus-gene-dots]
scales = [1,66,1]
include=["focus-gene","general"]

[track.focus-gene]
scales = [19,66,4]
include=["focus-gene","general"]

[track.focus-gene-transcripts]
scales = [9,18,6]
include=["focus-gene","general"]

[track.focus-gene-zoomed-transcripts-letters]
program_name = "focus-gene-zoomed-transcripts"
scales = [0,7,8]
include=["focus-gene","general"]

[track.focus-gene-zoomed-transcripts-no-letters.general]
program_name = "focus-gene-zoomed-transcripts"
scales = [8,8,1]
include=["focus-gene","general"]

[track.focus-gene-zoomed-transcripts-no-letters.values]
scale-no-letters = true

# focus transcript

[include.focus-transcript.general]
triggers = [
    ["track","focus","item","transcript"]
]

[include.focus-transcript.settings]
focus-transcript = ["track","focus","item","transcript"]
focus = ["track","focus"]
focus-transcript-label = ["track","focus","label"]
name = ["track","focus","name"]

[track.focus-transcript]
scales = [1,66,4]
include=["focus-transcript","general"]

[track.focus-transcript-dots]
program_name = "focus-transcript-dots"
scales = [1,66,1]
include=["focus-transcript","general"]


# gene track for SV alignments

[track.sv-transcript]
program_name = "sv-transcript"
scales = [3,16,6]
triggers = [["track","sv-gene"]]
include=["general"]

[include.sv-gene.general]
program_name = "sv-gene"
triggers = [["track","sv-gene"]]
include=["general"]

[track.sv-gene-1.general]
include=["sv-gene","general"]
scales = [17,19,2]
[track.sv-gene-1.values]
zoom-level = 18

[track.sv-gene-2.general]
include=["sv-gene","general"]
scales = [20,21,2]
[track.sv-gene-2.values]
zoom-level = 21

[track.sv-gene-overview]
program_name = "sv-gene-overview"
triggers = [["track","sv-gene"]]
scales = [22,100,6]
include=["general"]


#
# Frame
#

[track.framing]
include = ["general"]
triggers = [["track"]]
scales = [1,100,1]

#
# Ruler
#

[track.ruler.general]
include = ["general"]
scales = [0,100,1]
triggers = [["ruler"]]

[track.ruler.settings]
one_based = ["ruler","one_based"]

#
# Focus locations
#

[track.focus-region.general]
scales = [0,99,1]
include = ["general"]
triggers = [
    ["track","focus","item","location"]
]

[track.focus-region.settings]
region = ["track","focus","item","location"]

#
# Variants
#

[track.focus-variant.general]
include = ["general"]
scales = [1,5,1]
triggers = [["track","focus","item","variant"]]

[track.focus-variant.settings]
focus-variant = ["track","focus","item","variant"]
name = ["track","focus","name"]
label-snv-id = ["track","focus","variant","label-snv-id"]
label-snv-alleles = ["track","focus","variant","label-snv-alleles"]
label-other-id = ["track","focus","variant","label-other-id"]
label-other-alleles = ["track","focus","variant","label-other-alleles"]
show-extents = ["track","focus","variant","show-extents"]

[track.focus-variant-summary.general]
include = ["general"]
scales = [6,100,4]
triggers = [["track","focus","item","variant"]]

[track.focus-variant-summary.settings]
focus-variant = ["track","focus","item","variant"]
name = ["track","focus","name"]

[track.focus-variant-dots.general]
scales = [1,66,1]
include=["general"]
triggers = [["track","focus","item","variant"]]

[track.focus-variant-dots.settings]
focus-variant = ["track","focus","item","variant"]

# Expansion tracks (variation, repeats etc.)
[expansion.general]
channel = ["ensembl","main"]
name = "general"
triggers = [
    ["track","expand"]
]
run = "register_track"
